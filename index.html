<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axius Core</title>
<meta name="description" content="Axius Core LLC. Website coming soon.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%2307090c'/%3E%3Cpath d='M14 46l14-14-14-14M34 46h16' fill='none' stroke='%2300e5a8' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root{--bg:#07090c;--ink:#d9fff4;--mute:#6f8a82;--acc:#00e5a8;--acc2:#38bdf8;--line:rgba(0,229,168,.16)}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--ink);min-height:100vh;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  .grid{position:fixed;inset:0;z-index:0;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 20%,transparent 75%)}
  .scan{position:fixed;inset:0;z-index:1;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
  .wrap{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column;padding:0 clamp(18px,5vw,64px)}
  header{display:flex;justify-content:space-between;align-items:center;padding:24px 0;font-size:13px;color:var(--mute)}
  header b{color:var(--acc);font-weight:600;letter-spacing:.06em}
  .live{display:flex;align-items:center;gap:8px}
  .live i{width:8px;height:8px;border-radius:50%;background:var(--acc);animation:blink 1.6s infinite}
  @keyframes blink{50%{opacity:.25}}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:900px;padding-bottom:6vh}
  .prompt{color:var(--mute);font-size:clamp(14px,1.6vw,17px);margin-bottom:22px}
  .prompt span{color:var(--acc)}
  h1{font-size:clamp(44px,9.5vw,118px);line-height:1;letter-spacing:-.04em;font-weight:700;text-transform:uppercase}
  h1 .a{color:var(--ink)}
  h1 .b{color:transparent;-webkit-text-stroke:2px var(--acc)}
  .cursor{display:inline-block;width:.5em;height:.09em;background:var(--acc);margin-left:.12em;animation:blink 1s steps(1) infinite}
  .status{margin-top:34px;border:1px solid var(--line);background:rgba(0,229,168,.04);border-radius:10px;padding:18px 20px;max-width:560px;font-size:15px;line-height:1.9}
  .status div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px dashed rgba(0,229,168,.14)}
  .status div:last-child{border:0}
  .status em{font-style:normal;color:var(--mute)}
  .status strong{font-weight:500;color:var(--acc)}
  .status a{color:var(--acc2);text-decoration:none}
  .status a:hover{text-decoration:underline}
  footer{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;padding:20px 0 26px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
  @media (prefers-reduced-motion:reduce){.live i,.cursor{animation:none}}
</style>
</head>
<body>
<div class="grid"></div><div class="scan"></div>
<div class="wrap">
  <header><b>[ AXIUS_CORE ]</b><span class="live"><i></i>system: coming soon</span></header>
  <main>
    <div class="prompt"><span>axius@core</span>:~$ ./launch --site</div>
    <h1><span class="a">Axius</span><br><span class="b">Core</span><span class="cursor"></span></h1>
    <div class="status">
      <div><em>status</em><strong>coming_soon</strong></div>
      <div><em>company</em><strong>AXIUS CORE LLC</strong></div>
      <div><em>contact</em><a href="mailto:info@axius.am">info@axius.am</a></div>
    </div>
  </main>
  <footer><span>© 2026 AXIUS CORE LLC</span><span>Armenia · axius.am</span></footer>
</div>
</body>
</html>
